
name: Build MuslimDay APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q MuslimDay.zip -d .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p MuslimDay assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuslimDay-APK
          path: MuslimDay/app/build/outputs/apk/debug/app-debug.apk
          
